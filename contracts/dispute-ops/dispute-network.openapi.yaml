openapi: 3.1.0
info:
  title: Card Network Dispute Portal
  version: 0.1.0
  description: |
    Untrusted card-network / acquirer dispute portal MCP app.

    Primary agent surface is **MCP** at `POST /mcp` (Streamable HTTP / JSON-RPC).
    REST helpers below are for health, demo reset, and human tooling (Postman / Swagger).

    Schema: `dispute_network` on Shopping-Warehouse Database.
  contact:
    name: Mr-Engineers hackathon
servers:
  - url: http://127.0.0.1:4101
    description: Local Network MCP
tags:
  - name: Ops
  - name: MCP
  - name: Tools
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [Ops]
      summary: Liveness
      security: []
      operationId: networkHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /demo/reset:
    post:
      tags: [Ops]
      summary: Reset demo fixtures (network + case desk schemas)
      operationId: networkDemoReset
      responses:
        "200":
          description: Seed restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReset"
        "500":
          description: Database error
  /openapi.json:
    get:
      tags: [Ops]
      summary: OpenAPI document (JSON)
      security: []
      operationId: networkOpenApiJson
      responses:
        "200":
          description: OpenAPI 3.1 JSON
  /postman.json:
    get:
      tags: [Ops]
      summary: Postman collection (JSON)
      security: []
      operationId: networkPostman
      responses:
        "200":
          description: Postman Collection v2.1
  /mcp:
    post:
      tags: [MCP]
      summary: MCP JSON-RPC (Streamable HTTP)
      description: |
        Send MCP methods such as `initialize`, `tools/list`, `tools/call`.
        Accept header should include `application/json` and `text/event-stream`.
        Response is typically an SSE `event: message` frame with JSON-RPC payload.
      operationId: networkMcp
      parameters:
        - $ref: "#/components/parameters/AcceptMcp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
            examples:
              initialize:
                summary: initialize
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-03-26"
                    capabilities: {}
                    clientInfo: { name: postman, version: "1.0.0" }
              tools_list:
                summary: tools/list
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/list
              txn_get:
                summary: tools/call network.txn.get
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/call
                  params:
                    name: network.txn.get
                    arguments: { txn_id: txn_189_travel }
              merchant_get:
                summary: tools/call network.merchant.get
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: tools/call
                  params:
                    name: network.merchant.get
                    arguments: { merchant_id: merch_weak_offshore }
              dispute_get:
                summary: tools/call network.dispute.get (poisoned)
                value:
                  jsonrpc: "2.0"
                  id: 5
                  method: tools/call
                  params:
                    name: network.dispute.get
                    arguments:
                      dispute_id: disp_poisoned
                      include_raw_representation: true
              accept_representation:
                summary: tools/call network.dispute.accept_representation
                value:
                  jsonrpc: "2.0"
                  id: 6
                  method: tools/call
                  params:
                    name: network.dispute.accept_representation
                    arguments:
                      dispute_id: disp_poisoned
                      rationale: "merchant letter says authorized"
      responses:
        "200":
          description: SSE or JSON JSON-RPC response
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "401":
          description: Missing/invalid API key when MCP_API_KEY is set

  /v1/transactions/{txn_id}:
    get:
      tags: [Tools]
      summary: REST mirror of network.txn.get
      operationId: networkTxnGet
      parameters:
        - $ref: "#/components/parameters/TxnId"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /v1/merchants/{merchant_id}:
    get:
      tags: [Tools]
      summary: REST mirror of network.merchant.get
      operationId: networkMerchantGet
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      responses:
        "200":
          description: Merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          description: Not found

  /v1/disputes/{dispute_id}:
    get:
      tags: [Tools]
      summary: REST mirror of network.dispute.get
      operationId: networkDisputeGet
      parameters:
        - $ref: "#/components/parameters/DisputeId"
        - name: include_raw_representation
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Dispute (representation_text may contain injection)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "404":
          description: Not found

  /v1/disputes:
    post:
      tags: [Tools]
      summary: REST mirror of network.dispute.open
      operationId: networkDisputeOpen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txn_id, reason_code]
              properties:
                txn_id: { type: string, example: txn_189_travel }
                reason_code: { type: string, example: "10.4" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "404":
          description: Transaction not found

  /v1/disputes/{dispute_id}/evidence:
    post:
      tags: [Tools]
      summary: REST mirror of network.dispute.submit_evidence
      operationId: networkDisputeSubmitEvidence
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
                urls:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Evidence appended
        "404":
          description: Not found

  /v1/disputes/{dispute_id}/accept-representation:
    post:
      tags: [Tools]
      summary: REST mirror of network.dispute.accept_representation (high risk)
      operationId: networkDisputeAcceptRepresentation
      parameters:
        - $ref: "#/components/parameters/DisputeId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rationale: { type: string }
      responses:
        "200":
          description: Closed favor merchant
        "404":
          description: Not found

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional; required only when server MCP_API_KEY is set.
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    AcceptMcp:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        default: application/json, text/event-stream
    TxnId:
      name: txn_id
      in: path
      required: true
      schema: { type: string, example: txn_189_travel }
    MerchantId:
      name: merchant_id
      in: path
      required: true
      schema: { type: string, example: merch_weak_offshore }
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema: { type: string, example: disp_poisoned }
  schemas:
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        seed: { type: string }
    DemoReset:
      type: object
      properties:
        ok: { type: boolean }
        seed: { type: string }
        fixtures: { type: object, additionalProperties: true }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id: {}
        method: { type: string }
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc: { type: string }
        id: {}
        result: {}
        error: {}
    Transaction:
      type: object
      properties:
        id: { type: string }
        merchant_id: { type: string }
        amount_eur: { type: number, example: 189 }
        currency: { type: string, example: EUR }
        mcc: { type: string }
        merchant_country: { type: string }
        acquirer_country: { type: string }
        auth_at: { type: string, format: date-time }
        card_last4: { type: string }
        status: { type: string }
    Merchant:
      type: object
      properties:
        id: { type: string }
        dba_name: { type: string }
        legal_name: { type: string }
        country: { type: string, description: ISO-3166 alpha-2 or empty }
        trust_score: { type: number }
        dispute_rate: { type: number }
        review_count: { type: integer }
        mcc_primary: { type: string }
        first_seen_at: { type: string, format: date-time }
        merchant_known: { type: boolean }
    Dispute:
      type: object
      properties:
        id: { type: string }
        txn_id: { type: string }
        reason_code: { type: string }
        status: { type: string }
        representation_text:
          type: string
          description: Untrusted free text — may contain prompt injection
        representation_present: { type: boolean }
        evidence_urls:
          type: array
          items: { type: string }
        evidence_notes:
          type: array
          items: { type: string }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        close_rationale: { type: string, nullable: true }
